healthCheckTimeout: 600
logLevel: info
startPort: 10001

macros:
  "llama-server-base": |
    /usr/local/bin/llama-server
    --host 0.0.0.0
    --port ${PORT}
    --no-warmup
    --threads -1
    --flash-attn on
    --batch-size 512
    --ubatch-size 128
    --parallel 1

  # Offload profiles (flag-only)
  "gpu-max": |
    --n-gpu-layers -1
  "gpu-none": |
    --n-gpu-layers 0

  # Context/KV presets (flag-only)
  "ctx-16k": |
    --ctx-size 16384  -ctk q4_0 -ctv q4_0
  "ctx-32k": |
    --ctx-size 32768  -ctk q4_0 -ctv q4_0
  "ctx-64k": |
    --ctx-size 65536  -ctk q4_0 -ctv q4_0
  "ctx-128k": |
    --ctx-size 131072 -ctk q4_0 -ctv q4_0
  "ctx-262k": |
    --ctx-size 262144 -ctk q4_0 -ctv q4_0

  # Sampling presets (flag-only)
  "samp-instruct": |
    --temp 0.7 --min-p 0.0 --top-p 0.8  --top-k 20
  "samp-thinking": |
    --temp 0.6 --min-p 0.0 --top-p 0.95 --top-k 20
  "samp-creative": |
    --temp 1.0 --min-p 0.0 --top-p 1.0  --top-k 0

  # Selective CPU ops for very large models (flag-only)
  "ffn-exp-cpu": |
    -ot ".ffn_.*_exps.=CPU"

models:
  "qwen3-30b-coder-q4":
    cmd: |
      ${llama-server-base}
      ${gpu-max}
      ${ctx-128k}
      ${samp-instruct}
      --repeat-penalty 1.05
      --model /models/Qwen3-Coder-30B-A3B-Instruct-GGUF/Qwen3-Coder-30B-A3B-Instruct-UD-Q4_K_XL.gguf
    ttl: 86400

groups:
  "main-swap-group":
    swap: true
    exclusive: true
    members:
      - "qwen3-30b-coder-q4"

hooks:
  on_startup:
    preload:
      - "qwen3-30b-coder-q4"

