services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: vllm-server
    restart: always
    ports:
      - 8080:8000
    volumes:
      - ./models:/models
    environment:
      - HF_HOME=/models
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_ATTENTION_BACKEND=FLASHINFER
    networks:
      - llm-net
    command:
      - --model=cpatonn/Qwen3-Coder-30B-A3B-Instruct-AWQ-4bit
      - --served-model-name=qwen3-coder
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=32768
      - --max-num-seqs=64
      - --gpu-memory-utilization=0.90
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
          - capabilities: ["gpu"]
            driver: nvidia
            count: all
    ipc: host

  webui:
    image: ghcr.io/open-webui/open-webui
    container_name: webui
    volumes:
      - webui:/app/backend/data
    depends_on:
      - vllm-server 
    ports:
      - 3000:3000 
    environment:
      - WEBUI_AUTH=False
      - PORT=3000
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URLS=http://vllm-server:8000/v1
      - OPENAI_API_KEYS=dummy
      - ENABLE_OLLAMA_API=False
    networks:
      - llm-net
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

networks:
  llm-net:
    driver: bridge

volumes:
  webui: {}
  models: {}
